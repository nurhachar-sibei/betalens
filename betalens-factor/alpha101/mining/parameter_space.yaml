# 配置版本；当前仅支持 1。
version: 1
# 因子类别；用于任务元信息、输出归类，并启用 alpha101 的 `factors: all` 展开。
factor_class: alpha101

# factors 有两种写法：
# 1. 像下面一样显式列出一个或多个 Alpha；
# 2. 将整个 factors 映射替换为 `factors: all`，自动生成 ALPHA1 至 ALPHA101。
# `all` 使用 alpha101_parameters.py 的启发式规则，默认最多放开每个公式前三个
# 可搜索参数；显式配置不会调用自动空间生成逻辑。
factors:
  ALPHA3:
    # 可导入且提供 make_mining_spec(params) 的 Python 模块。
    module: alpha101_mining
    # 可选：precomputed | rolling_fit。Alpha101 使用 precomputed。
    execution_mode: precomputed
    parameters:
      # ALPHA3 论文默认窗口为 10。自动规则以 [5, 10, 20] 推导出 5..20 边界；
      # 这些不是三个离散候选，粗搜可以采样区间内任意合法整数。
      rank_open_rank_volume_correlation_window:
        # 可选：int | float | categorical | bool。
        type: int
        # 数值参数的闭区间边界；log 尺度要求 low > 0。
        low: 5
        high: 20
        # 可选：linear | log。窗口和 lag 通常使用 log。
        scale: log
        # 正整数步长；log 整数参数必须为 1。
        step: 1

evaluation:
  # 评分区间 [开始日期, 结束日期]，格式 YYYY-MM-DD。
  span: ["2010-01-01", "2022-12-31"]
  # 调仓频率，使用 pandas 频率字符串；常用：D | W | M。
  rebal_freq: W
  # 可选：vector | exact。vector 适合大规模搜索，exact 适合精确成交复核。
  engine: vector
  # 回测初始资金，必须为正数。
  initial_amount: 100000000
  # 可选：行情查询容忍时间（小时），默认 24。
  # time_tolerance: 24

windows:
  # 评分窗口长度，单位为交易日，可配置多个正整数。
  lengths: [252, 504]
  # 窗口滑动步长，单位为交易日；每个 step 必须 <= 每个 length。
  steps: [21, 63]

search:
  coarse:
    # 可选：random | tpe。
    sampler: random
    # 粗搜试验数，正整数；重复参数会由候选 ID 去重。
    n_trials: 64
    # 固定随机种子，保证候选生成可复现。
    seed: 20260818
  fine:
    # 取粗搜排名靠前的多少个入选候选作为局部网格锚点。
    top_k: 8
    # 每个数值参数在局部边界内生成的网格点数，正整数。
    points_per_dimension: 7
    # 细搜候选总上限，防止多参数笛卡尔积失控。
    max_candidates: 256

selection:
  objective:
    # 可选窗口指标：ann_ret | ann_vol | sharpe | mdd | calmar | turnover |
    # rank_ic | ic_coverage | n_days。
    metric: sharpe
    # 可选聚合：mean | median | p25 | min | max。
    aggregate: median
    # 可选：maximize | minimize。
    direction: maximize
  filters:
    # 汇总字段可使用 valid_window_ratio、max_mdd 或 <指标>_<聚合>，
    # 例如 sharpe_median、ann_ret_p25、turnover_mean。
    - metric: valid_window_ratio
      # 可选：">=" | "<=" | ">" | "<" | "=="。
      op: ">="
      value: 0.8
    - metric: max_mdd
      op: "<="
      value: 0.35
  # 最终最多保留的赢家数量，正整数。
  top_k: 10
