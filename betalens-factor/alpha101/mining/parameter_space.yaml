# 配置版本；当前仅支持 1。
version: 1
# 因子类别；用于任务元信息、输出归类，并启用 alpha101 的 `factors: all` 展开。
factor_class: alpha101

# factors 有三种写法：
# 1. 像下面一样显式配置一个或多个 Alpha；
# 2. 将整个 factors 映射替换为 `factors: all`，自动生成 ALPHA1 至 ALPHA101。
# 3. 使用紧凑列表，如 `factors: [ALPHA8, ALPHA9]`，自动生成这些 Alpha 的参数空间。
# `all` 使用 alpha101_parameters.py 的启发式规则，默认最多放开每个公式前五个
# 可搜索参数；显式配置不会调用自动空间生成逻辑。
# 显式因子也可像 ALPHA3 一样写 `parameters: auto`，只自动生成该因子的参数空间。
factors:
  ALPHA8:
    # 可导入且提供 make_mining_spec(params) 的 Python 模块。
    module: alpha101_mining
    # ALPHA8 参数在全区间固定，使用 precomputed：每组参数只计算一次完整净值。
    execution_mode: precomputed
    # ALPHA8 论文默认参数为 5、5、10；这里使用覆盖一个数量级的宽范围。
    parameters:
      open_sum_window:
        type: int
        low: 1
        high: 50
        step: 1
        scale: log
      returns_sum_window:
        type: int
        low: 1
        high: 50
        step: 1
        scale: log
      base_delay_lag:
        type: int
        low: 1
        high: 100
        step: 1
        scale: log
    # 自动扩边不能突破的硬边界；窗口类上限 1260，滞后类上限 504。
    parameter_limits:
      open_sum_window: {low: 1, high: 1260}
      returns_sum_window: {low: 1, high: 1260}
      base_delay_lag: {low: 1, high: 504}

# 仅用于 `factors: all` 或 `parameters: auto`。
alpha101_parameter_generation:
  # 相对论文默认值 d 的搜索跨度 m；窗口约为 [d/m, d*m]，必须 > 1。
  range_multiplier: 10
  # 按公式签名顺序最多放开的可搜索维数，正整数；其余参数固定为论文默认值。
  max_dimensions: 5
  # 类型级硬边界：自动初始边界和后续自动扩边都不得突破这些范围。
  type_limits:
    window: {low: 1, high: 1260}
    lag: {low: 1, high: 504}
    weight: {low: 0.0, high: 1.0}
    threshold: {low: -10.0, high: 10.0}
    exponent: {low: 0.01, high: 100.0}

evaluation:
  # 评分区间 [开始日期, 结束日期]，格式 YYYY-MM-DD。
  span: ["2010-01-01", "2022-12-31"]
  # 调仓频率，使用 pandas 频率字符串；常用：D | W | M。
  rebal_freq: W
  # 可选：vector | exact。vector 适合大规模搜索，exact 适合精确成交复核。
  engine: vector
  # 回测初始资金，必须为正数。
  initial_amount: 100000000
  # 热力图只展示完整 span（total），并按每种滑动窗口组合分别输出。
  # 可选：行情查询容忍时间（小时），默认 24。
  # time_tolerance: 24

windows:
  # 评分窗口长度，单位为交易日，可配置多个正整数。
  lengths: [252, 504, 756]
  # 窗口滑动步长，单位为交易日；每个 step 必须 <= 每个 length。
  steps: [21, 42, 63]

search:
  coarse:
    # 可选：qmc | random | tpe。宽搜推荐 qmc。
    sampler: qmc
    # QMC 序列可选：sobol | halton；Sobol 的试验数宜使用 2 的幂。
    qmc_type: sobol
    # 是否随机扰乱低差异序列；true 在保持覆盖性的同时受 seed 控制。
    scramble: true
    # 宽搜试验数，正整数；重复参数会由候选 ID 去重。
    n_trials: 128
    # 固定随机种子，保证候选生成可复现。
    seed: 20260818
  refine:
    # 可选：true | false。QMC 宽搜后使用独立 TPE study 自适应收敛。
    enabled: true
    sampler: tpe
    # TPE 总试验数及每轮完成后反馈给 study 的批大小，均为正整数。
    n_trials: 48
    batch_size: 8
    # TPE 在开始模型采样前的随机试验数，正整数。
    n_startup_trials: 8
    # 从前序宽搜中导入目标值最好的多少个 completed trial 作为 TPE 先验。
    bootstrap_top_k: 16
    seed: 20260819
  expansion:
    # 可选：true | false。优胜候选持续靠近同一边界时启动新的 QMC study。
    enabled: true
    sampler: qmc
    qmc_type: sobol
    n_trials: 64
    # 最多扩边轮数；每轮都是新 study，不会动态修改已有 study 的分布。
    max_rounds: 2
    # 检查排名靠前的候选数。
    boundary_top_k: 3
    # 归一化参数轴两端各 10% 视为靠近边界，范围 [0, 0.5)。
    boundary_tolerance: 0.10
    # 至少 67% 的优胜候选靠近同一侧才扩边，范围 (0, 1]。
    winner_ratio: 0.67
    # 每次向触边侧扩大 3 倍，但不会突破类型级硬边界。
    range_multiplier: 3
    seed: 20260820
  fine:
    # 取粗搜排名靠前的多少个入选候选作为局部网格锚点。
    top_k: 8
    # 每个数值参数在局部边界内生成的网格点数，正整数。
    points_per_dimension: 7
    # ALPHA8 有三个参数，每维 7 点，允许完整执行 7^3=343 个局部网格组合。
    max_candidates: 343
  stability:
    # 可选：true | false。对最终赢家附近施加随机参数误差，验证局部稳定性。
    enabled: true
    # 验证前多少名赢家，以及每名赢家生成多少个扰动候选。
    top_k: 3
    perturbations_per_candidate: 8
    # 扰动半径占全局参数跨度的比例，范围 (0, 0.5]；log 参数在对数轴扰动。
    radius_ratio: 0.10
    # 单个扰动相对赢家允许的目标值退化上限，0.20 表示最多退化 20%。
    max_objective_degradation: 0.20
    # 至少 70% 的有效扰动满足退化上限，且至少 80% 的扰动有效，才判为稳定。
    required_pass_ratio: 0.70
    minimum_valid_ratio: 0.80
    # false 仅审计标注稳定性；true 会从最终赢家中剔除不稳定候选。
    require_pass: false
    seed: 20260821

selection:
  objective:
    # 可选窗口指标：ann_ret | ann_vol | sharpe | mdd | calmar | turnover |
    # rank_ic | ic_coverage | n_days。
    metric: sharpe
    # 可选聚合：mean | median | p25 | min | max。
    aggregate: median
    # 可选：maximize | minimize。
    direction: maximize
  filters:
    # 汇总字段可使用 valid_window_ratio、max_mdd 或 <指标>_<聚合>，
    # 例如 sharpe_median、ann_ret_p25、turnover_mean。
    - metric: valid_window_ratio
      # 可选：">=" | "<=" | ">" | "<" | "=="。
      op: ">="
      value: 0.8
    - metric: max_mdd
      op: "<="
      value: 0.35
  # 最终最多保留的赢家数量，正整数。
  top_k: 10
