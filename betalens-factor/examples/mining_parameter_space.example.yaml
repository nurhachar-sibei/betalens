# 配置版本；当前仅支持 1。
version: 1
# 因子类别；用于任务元信息和输出归类，alpha101 还据此启用 `factors: all`。
factor_class: sample

# factors 为因子映射。Alpha101 还支持专用写法 `factors: all`；其他因子类
# 应显式列出每个因子及其模块、执行模式和参数空间。
factors:
  SAMPLE:
    # 可导入且提供 make_mining_spec(params) 的 Python 模块名或模块路径。
    module: factor_SAMPLE
    # 可选：precomputed | rolling_fit。
    # precomputed 每个候选只计算一次全程因子；rolling_fit 每个窗口独立拟合。
    execution_mode: precomputed
    parameters:
      window:
        # 数值类型可选：int | float。
        type: int
        # 数值参数的闭区间边界；log 尺度要求 low > 0。
        low: 20
        high: 500
        # 正数步长。log int 必须为 1；log float 不允许设置 step。
        step: 1
        # 可选：linear | log；省略时默认为 linear。
        scale: log
      n_quantiles:
        # 离散类型可选 categorical；choices 必须是非空列表。
        type: categorical
        # categorical 不进行数值细化，值也可以是字符串、布尔或列表/元组。
        # 纯布尔参数也可写成 type: bool 并省略 choices，默认搜索 false 和 true。
        choices: [10, 20]

evaluation:
  # 评分区间 [开始日期, 结束日期]，格式 YYYY-MM-DD，开始日期不得晚于结束日期。
  span: ["2010-01-01", "2022-12-31"]
  # 调仓频率，使用 pandas 频率字符串；常用：D | W | M。
  rebal_freq: W
  # 可选：vector | exact。vector 适合大规模搜索，exact 适合精确成交复核。
  engine: vector
  # 回测初始资金，必须为正数。
  initial_amount: 100000000
  # 可选：行情查询容忍时间（小时），默认 24。
  # time_tolerance: 24

windows:
  # 评分窗口长度，单位为交易日；列表元素必须为正整数。
  lengths: [252, 504]
  # 窗口滑动步长，单位为交易日；每个 step 必须 <= 每个 length。
  steps: [21, 63]

search:
  coarse:
    # 可选：random | tpe。
    sampler: random
    # 粗搜试验数，正整数；重复参数会由候选 ID 去重。
    n_trials: 64
    # Optuna 随机种子；固定后候选生成可复现。
    seed: 20260818
  fine:
    # 用于生成局部网格的粗搜优胜锚点数，正整数。
    top_k: 8
    # 每个数值维度的目标网格点数，正整数；实际点数受边界和 step 限制。
    points_per_dimension: 7
    # 细搜候选总上限，正整数；用于限制笛卡尔积规模。
    max_candidates: 256

selection:
  objective:
    # 可选窗口指标：ann_ret | ann_vol | sharpe | mdd | calmar | turnover |
    # rank_ic | ic_coverage | n_days。
    metric: sharpe
    # 可选聚合：mean | median | p25 | min | max。
    aggregate: median
    # 可选：maximize | minimize。
    direction: maximize
  filters:
    # metric 可使用 valid_window_ratio、max_mdd 或 <指标>_<聚合>；
    # op 可选：">=" | "<=" | ">" | "<" | "=="。
    - metric: valid_window_ratio
      op: ">="
      value: 0.8
  # 最终最多保留的赢家数量，正整数。
  top_k: 10
